<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email - ELLORE Fashion</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .verify-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 420px;
            width: 100%;
            padding: 50px 40px;
        }

        .logo {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo h1 {
            font-size: 36px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .logo p {
            color: #666;
            font-size: 15px;
            line-height: 1.5;
        }

        .email-display {
            background: #f5f5f5;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 25px;
            text-align: center;
        }

        .email-display strong {
            color: #667eea;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 18px;
            text-align: center;
            letter-spacing: 4px;
            transition: all 0.3s;
            font-weight: 600;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn-verify {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-verify:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-verify:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-resend {
            width: 100%;
            padding: 14px;
            background: transparent;
            color: #667eea;
            border: 2px solid #667eea;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 15px;
        }

        .btn-resend:hover {
            background: rgba(102, 126, 234, 0.1);
        }

        .btn-resend:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .alert {
            padding: 14px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
            font-weight: 500;
        }

        .alert-error {
            background-color: #fee;
            border: 1px solid #fcc;
            color: #c33;
        }

        .alert-success {
            background-color: #efe;
            border: 1px solid #cfc;
            color: #3c3;
        }

        .alert-info {
            background-color: #e3f2fd;
            border: 1px solid #90caf9;
            color: #1976d2;
        }

        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid #ffffff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .home-link {
            position: absolute;
            top: 30px;
            left: 30px;
            color: white;
            text-decoration: none;
            font-size: 14px;
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            transition: all 0.3s;
            font-weight: 500;
        }

        .home-link:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateX(-5px);
        }

        .help-text {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #666;
        }

        @media (max-width: 480px) {
            .verify-container {
                padding: 40px 30px;
            }

            .home-link {
                top: 20px;
                left: 20px;
                font-size: 13px;
                padding: 10px 20px;
            }
        }
    </style>
</head>

<body>
    <a href="index.html" class="home-link">← Back to Home</a>

    <div class="verify-container">
        <div class="logo">
            <h1>ELLORE</h1>
            <p>Please verify your email address to complete registration.</p>
        </div>

        <div class="email-display">
            Email: <strong id="displayEmail"></strong>
        </div>

        <div id="alert-container"></div>

        <form id="verifyForm">
            <div class="form-group">
                <label for="code">Verification Code</label>
                <input type="text" id="code" name="code" required placeholder="000000" maxlength="6" pattern="[0-9]{6}">
                <p class="help-text">Check your email for the 6-digit code</p>
            </div>

            <button type="submit" class="btn-verify" id="verifyBtn">
                <span id="btnText">Verify Email</span>
            </button>

            <button type="button" class="btn-resend" id="resendBtn">
                <span id="resendText">Resend Code</span>
            </button>
        </form>
    </div>

    <script src="auth.js"></script>
    <script>
        // Get email from URL parameter
        const urlParams = new URLSearchParams(window.location.search);
        const email = urlParams.get('email');

        if (!email) {
            window.location.href = 'signup.html';
        }

        // Display email
        document.getElementById('displayEmail').textContent = email;

        // Handle verification form submission
        document.getElementById('verifyForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const code = document.getElementById('code').value.trim();
            const verifyBtn = document.getElementById('verifyBtn');
            const btnText = document.getElementById('btnText');

            if (code.length !== 6) {
                showAlert('Please enter a 6-digit verification code.', 'error');
                return;
            }

            // Disable button and show loading
            verifyBtn.disabled = true;
            btnText.innerHTML = '<span class="spinner"></span>Verifying...';
            showAlert('', '');

            try {
                await Auth.confirmSignUp(email, code);
                showAlert('Email verified successfully! Redirecting to login...', 'success');

                // Redirect to login page
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);

            } catch (error) {
                console.error('Verification error:', error);
                let errorMessage = 'Verification failed. Please try again.';

                if (error.code === 'CodeMismatchException') {
                    errorMessage = 'Invalid verification code. Please check and try again.';
                } else if (error.code === 'ExpiredCodeException') {
                    errorMessage = 'Verification code has expired. Please request a new code.';
                } else if (error.code === 'NotAuthorizedException') {
                    errorMessage = 'Invalid verification code.';
                } else if (error.message) {
                    errorMessage = error.message;
                }

                showAlert(errorMessage, 'error');
                verifyBtn.disabled = false;
                btnText.textContent = 'Verify Email';
            }
        });

        // Handle resend code button
        document.getElementById('resendBtn').addEventListener('click', async function () {
            const resendBtn = document.getElementById('resendBtn');
            const resendText = document.getElementById('resendText');

            resendBtn.disabled = true;
            resendText.innerHTML = '<span class="spinner"></span>Sending...';
            showAlert('', '');

            try {
                await Auth.resendConfirmationCode(email);
                showAlert('Verification code sent! Please check your email.', 'success');

                // Re-enable after 30 seconds
                setTimeout(() => {
                    resendBtn.disabled = false;
                    resendText.textContent = 'Resend Code';
                }, 30000);

            } catch (error) {
                console.error('Resend error:', error);
                let errorMessage = 'Failed to resend code. Please try again.';

                if (error.message) {
                    errorMessage = error.message;
                }

                showAlert(errorMessage, 'error');
                resendBtn.disabled = false;
                resendText.textContent = 'Resend Code';
            }
        });

        function showAlert(message, type) {
            const container = document.getElementById('alert-container');
            if (!message) {
                container.innerHTML = '';
                return;
            }

            let alertClass = 'alert-error';
            if (type === 'success') alertClass = 'alert-success';
            if (type === 'info') alertClass = 'alert-info';

            container.innerHTML = `<div class="alert ${alertClass}">${message}</div>`;
        }

        // Auto-focus on code input
        window.addEventListener('load', () => {
            document.getElementById('code').focus();
        });
    </script>
</body>

</html>
