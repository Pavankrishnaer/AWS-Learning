<!DOCTYPE html>
<html class="light" lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ELLORE | Men</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet" />
  <script src="auth.js"></script>
  <style>
    body {
      font-family: 'Manrope', sans-serif;
    }

    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
    }

    .primary-gradient {
      background: linear-gradient(135deg, #00327d 0%, #0047ab 100%);
    }

    .glass-nav {
      background: rgba(249, 249, 249, 0.9);
      backdrop-filter: blur(24px);
    }

    .cart-drawer {
      transform: translateX(100%);
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .cart-drawer.open {
      transform: translateX(0);
    }

    .cart-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s;
    }

    .cart-overlay.open {
      opacity: 1;
      pointer-events: all;
    }

    .lang-btn {
      transition: all 0.2s;
    }

    .lang-btn.active {
      background: #00327d;
      color: #fff;
    }

    .translate-indicator {
      display: none;
    }

    .translate-indicator.show {
      display: inline-block;
    }

    .toast {
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body class="bg-gray-50 text-gray-900">

  <nav class="fixed top-0 w-full z-40 glass-nav border-b border-gray-100">
    <div id="elloreNav"></div>
  </nav>

  <main class="pt-20">
    <!-- Hero Banner -->
    <div class="relative h-64 bg-gray-900 overflow-hidden">
      <img class="w-full h-full object-cover opacity-60" src="images/men/men-banner.jpg" alt="Men's Collection" />
      <div class="absolute inset-0 flex items-end px-12 pb-10">
        <div>
          <span class="text-xs font-bold uppercase tracking-widest text-white/60 block mb-2" id="page-cat">MEN'S
            COLLECTION</span>
          <h1 class="text-5xl font-black tracking-tighter text-white uppercase" id="page-title">HERREN / MEN</h1>
        </div>
      </div>
    </div>

    <!-- Filter Bar -->
    <div class="border-b border-gray-200 bg-white sticky top-20 z-30">
      <div class="max-w-[1920px] mx-auto px-12 py-4 flex justify-between items-center">
        <span class="text-xs uppercase tracking-widest font-bold text-gray-400" id="product-count">8 Products</span>
        <div class="flex gap-4">
          <select id="sortSelect" onchange="renderGrid(currentLang, this.value)"
            class="text-xs uppercase tracking-widest font-bold text-gray-600 bg-transparent border-none focus:ring-0 cursor-pointer">
            <option value="newest">SORT: NEWEST</option>
            <option value="low-high">PRICE: LOW TO HIGH</option>
            <option value="high-low">PRICE: HIGH TO LOW</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Product Grid -->
    <div class="max-w-[1920px] mx-auto px-12 py-16">
      <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-8" id="productGrid"></div>
    </div>
  </main>

  <footer class="bg-[#e2e2e2]">
    <div id="elloreFooter"></div>
  </footer>
  <script src="ellore.js"></script>
  <script>
    // MISSING FUNCTION - ADD THIS:
    function productCardHTML(p, lang) {
      const name = lang === 'de' && p.nameDE ? p.nameDE : p.name;
      const badge = p.badge ? `<div class="absolute top-4 right-4 ${p.badge === 'BESTSELLER' ? 'bg-[#00327d] text-white' : 'bg-white text-gray-900'} px-3 py-1 text-[10px] font-bold tracking-widest uppercase">${p.badge}</div>` : '';

      return `
      <div class="group cursor-pointer">
        <div class="aspect-[4/5] bg-white overflow-hidden relative mb-4">
          <img class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105" src="${p.img}" alt="${name}"/>
          ${badge}
          <div class="absolute bottom-0 left-0 right-0 bg-white/95 py-3 text-center opacity-0 group-hover:opacity-100 transition-opacity duration-300">
            <button class="text-[11px] font-black uppercase tracking-widest text-[#00327d]" onclick="addToCart(${p.id})">
              + ${lang === 'de' ? 'ZUR TASCHE' : 'ADD TO BAG'}
            </button>
          </div>
        </div>
        <div class="flex justify-between items-start mb-3">
          <div>
            <span class="text-[10px] font-bold uppercase text-gray-400 tracking-widest">${p.category} / ${p.tag}</span>
            <h3 class="text-sm font-bold mt-1">
              <a href="product.html?id=${p.id}" class="hover:text-[#00327d] transition-colors">${name}</a>
            </h3>
          </div>
          <span class="text-sm font-bold text-[#00327d]">€${p.price}</span>
        </div>
        <button class="w-full border border-[#00327d] text-[#00327d] py-2.5 text-[11px] font-black uppercase tracking-widest hover:bg-[#00327d] hover:text-white transition-colors" onclick="addToCart(${p.id})">
          ${lang === 'de' ? 'ZUR TASCHE HINZUFÜGEN' : 'ADD TO BAG'}
        </button>
      </div>
    `;
    }

    function onLangChange(lang) { renderGrid(lang); }

    function renderGrid(lang, sortMode) {
      lang = lang || currentLang;
      const items = [...PRODUCTS.filter(p => p.category === 'MEN')];
      const sort = sortMode || document.getElementById('sortSelect')?.value || 'newest';
      if (sort === 'low-high') items.sort((a, b) => a.price - b.price);
      if (sort === 'high-low') items.sort((a, b) => b.price - a.price);
      document.getElementById('productGrid').innerHTML = items.map(p => productCardHTML(p, lang)).join('');
    }

    document.addEventListener('DOMContentLoaded', () => { renderGrid(); });
  </script>
</body>

</html>
